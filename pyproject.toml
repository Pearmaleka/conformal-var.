[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conformal-var"
version = "0.1.0"
description = "Value-at-Risk forecasts with online conformal calibration, and the backtests to judge them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Le Nam Khanh" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "scipy>=1.10",
  "arch>=6.2",
  "scikit-learn>=1.3",
]
keywords = ["value-at-risk", "conformal prediction", "risk management", "backtesting", "garch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.80",
  "ruff>=0.5",
  "mypy>=1.10",
  "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/Pearmaleka/conformal-var"

[tool.hatch.build.targets.wheel]
packages = ["src/conformal_var"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["conformal_var"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
